name: Test Release

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: 'OS Patch Level (ex: 2025-12)'
        required: true
        type: string
        default: '2025-12'
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      kernels_to_build:
        description: 'Kernels à compiler (a13-5.15 par défaut)'
        required: true
        type: string
        default: 'a13-5.15'
      kernelsu_variant:
        description: "Select KernelSU"
        required: true
        type: choice
        options:
        - Official
        - Next
        - MKSU
        - SukiSU
        default: SukiSU
      kernelsu_branch:
        description: "Select KSU branch"
        required: true
        type: choice
        options:
        - Stable(标准)
        - Dev(开发)
        - Other(其他/指定)
        default: Stable(标准)
      version:
        description: 'Custom version name'
        required: false
        type: string
      use_zram:
        description: 'Enable more ZRAM algorithms?'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: 'Enable KPM functionality?'
        required: true
        type: boolean
        default: true
      BBG:
        description: "Enable BBG Support?"
        required: true
        type: boolean
        default: false

jobs:
  # Job spécifique pour votre kernel
  build-kernel-a13-5-15:
    if: contains(github.event.inputs.kernels_to_build, 'all') || contains(github.event.inputs.kernels_to_build, 'a13-5.15')
    uses: ./.github/workflows/kernel-a13-5.15.yml
    secrets: inherit
    with:
      os_patch_level: ${{ inputs.os_patch_level }}
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      BBG: ${{ inputs.BBG }}

  check-build-status:
    runs-on: ubuntu-latest
    needs: [build-kernel-a13-5-15]
    if: always()
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - id: check
        run: |
          if [[ "${{ needs.build-kernel-a13-5-15.result }}" == "success" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  trigger-release:
    runs-on: ubuntu-latest
    needs: [check-build-status]
    if: needs.check-build-status.outputs.should_release == 'true' && inputs.make_release
    env:
      GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate Tag
        run: |
          NEW_TAG="v2.0.0-r$(date +%s)"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: "GKI Kernel A13-5.15 - ${{ inputs.os_patch_level }}"
          body: |
            Build avec SUSFS et ${{ inputs.kernelsu_variant }}
            Patch Google : ${{ inputs.os_patch_level }}
            ZRAM: ${{ inputs.use_zram }} | KPM: ${{ inputs.use_kpm }}
          files: "**/*.zip"
